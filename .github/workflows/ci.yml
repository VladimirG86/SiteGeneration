name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r sitegen/requirements.txt
      - run: cd sitegen && python -m pytest tests/ -q
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check sitegen/static/app.js
